# Local development: PostgreSQL only, on loopback. Use with DATABASE_URL=postgres://truckpanel:dev@127.0.0.1:5432/truckpanel
# (or skip Docker entirely with DATABASE_URL=pglite://../../.pglite).
name: truckpanel-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: truckpanel
      POSTGRES_DB: truckpanel
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
